[package]
name = "git_worktree_copse"
version = "0.1.11"
edition = "2024"
description = "A CLI tool to quickly control git worktree"
license = "Apache-2.0"
repository = "https://github.com/usira-okay/Copse"
readme = "README.md"
keywords = ["git", "worktree", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
dialoguer = { version = "0.12.0", default-features = false }
inquire = { version = "0.9.4", default-features = false, features = ["console"] }
nucleo-matcher = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
